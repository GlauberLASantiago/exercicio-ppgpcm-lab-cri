<!DOCTYPE html>
<html lang="pt-BR">





  
<head>
  <meta charset="UTF-8">
  <title>Produção Multiplataforma - VR Forest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Favicon em Data URI (ícone de mídia/vídeo) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232e7d32'/><polygon points='40,30 70,50 40,70' fill='%23ffffff'/></svg>" type="image/svg+xml">

  <!-- A-Frame Core -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- A-Frame Environment Component (Cenário Forest) -->
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <style>
    /* Overlay inicial para habilitar áudio/TTS sem bloqueio de autoplay do navegador */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 25, 15, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #overlay button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: #2e7d32;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    #overlay button:hover {
      background: #388e3c;
    }
    #hud {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 100;
    }
  </style>

  <script>
    // Gerenciador de Áudio/TTS
    window.audioUnlocked = false;

    function speakText(text) {
      if (!('speechSynthesis' in window) || !window.audioUnlocked) return;
      
      // Cancela qualquer fala anterior para evitar sobreposição
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // Componente customizado A-Frame para detecção de proximidade e diálogo
    AFRAME.registerComponent('proximity-trigger', {
      schema: {
        radius: { type: 'number', default: 3.5 },
        title: { type: 'string', default: '' },
        message: { type: 'string', default: '' }
      },

      init: function () {
        this.camera = document.querySelector('#player-cam');
        this.isInside = false;

        // Criação da placa de diálogo 3D sobre o elemento
        this.infoCard = document.createElement('a-entity');
        this.infoCard.setAttribute('position', '0 2.4 0');
        this.infoCard.setAttribute('visible', 'false');

        // Fundo do card de texto
        const bgPlane = document.createElement('a-plane');
        bgPlane.setAttribute('color', '#1b2e1b');
        bgPlane.setAttribute('opacity', '0.85');
        bgPlane.setAttribute('width', '2.8');
        bgPlane.setAttribute('height', '1.1');
        bgPlane.setAttribute('material', 'shader: flat;');

        // Texto informativo
        const textEntity = document.createElement('a-text');
        textEntity.setAttribute('value', `${this.data.title}\n\n${this.data.message}`);
        textEntity.setAttribute('align', 'center');
        textEntity.setAttribute('color', '#ffffff');
        textEntity.setAttribute('width', '2.6');
        textEntity.setAttribute('wrap-count', '30');
        textEntity.setAttribute('position', '0 0 0.02');

        this.infoCard.appendChild(bgPlane);
        this.infoCard.appendChild(textEntity);
        this.el.appendChild(this.infoCard);
      },

      tick: function () {
        if (!this.camera) return;

        const playerPos = new THREE.Vector3();
        const triggerPos = new THREE.Vector3();

        this.camera.object3D.getWorldPosition(playerPos);
        this.el.object3D.getWorldPosition(triggerPos);

        const distance = playerPos.distanceTo(triggerPos);

        // Jogador entrou na área de alcance
        if (distance <= this.data.radius && !this.isInside) {
          this.isInside = true;
          this.infoCard.setAttribute('visible', 'true');
          speakText(`${this.data.title}. ${this.data.message}`);
        } 
        // Jogador saiu da área de alcance
        else if (distance > this.data.radius && this.isInside) {
          this.isInside = false;
          this.infoCard.setAttribute('visible', 'false');
        }

        // Faz o card sempre apontar para a câmera quando estiver visível
        if (this.isInside) {
          this.infoCard.object3D.lookAt(playerPos);
        }
      }
    });

    function iniciarExperiencia() {
      window.audioUnlocked = true;
      document.getElementById('overlay').style.display = 'none';

      // Dispara uma introdução por TTS
      speakText('Bem-vindo à trilha de produção de conteúdos multiplataforma. Explore os pontos para interagir.');
    }
  </script>
</head>
<body>

  <!-- Tela inicial para desbloqueio do Web Speech API -->
  <div id="overlay">
    <h1>Produção de Conteúdos Multiplataforma</h1>
    <p>Caminhe pela floresta e aproxime-se dos criadores e totens para aprender sobre estratégias de conteúdo.</p>
    <button onclick="iniciarExperiencia()">Entrar na Floresta</button>
  </div>

  <div id="hud">Use WASD ou as setas para mover • Arraste com o mouse para olhar</div>

  <a-scene>
    <!-- Cenário Floresta -->
    <a-entity environment="preset: forest; dressingAmount: 250; groundTexture: walkNoise; lighting: distant;"></a-entity>

    <!-- Iluminação Suplementar -->
    <a-light type="ambient" color="#cbe2b8" intensity="0.5"></a-light>
    <a-light type="directional" position="5 10 3" intensity="0.8" castShadow="true"></a-light>

    <!-- Jogador / Câmera -->
    <a-entity id="rig" position="0 0 5">
      <a-camera id="player-cam" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 25">
        <a-cursor color="#4CAF50" opacity="0.6"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- ================= NPC 1: Especialista em Transmídia ================= -->
    <a-entity id="npc-transmidia" position="-5 0 -2"
              proximity-trigger="title: Elena - Narrativa Transmídia; message: No transmídia, cada canal conta uma parte única da história, complementando o universo sem se repetir.">
      <!-- Corpo Simulado (Estilo Low-Poly) -->
      <a-cylinder position="0 0.75 0" radius="0.3" height="1.5" color="#1976D2"></a-cylinder>
      <a-sphere position="0 1.7 0" radius="0.25" color="#FFE0B2"></a-sphere>
      <!-- "Acessório/Óculos" -->
      <a-box position="0 1.75 0.22" width="0.3" height="0.08" depth="0.05" color="#263238"></a-box>
      <!-- Base com anel de área -->
      <a-ring rotation="-90 0 0" radius-inner="0.4" radius-outer="0.5" color="#2196F3"></a-ring>
    </a-entity>

    <!-- ================= NPC 2: Criador de Vídeos Verticais ================= -->
    <a-entity id="npc-video" position="5 0 -3"
              proximity-trigger="title: Rafael - Vídeo Vertical; message: Formatos curtos precisam de gancho forte nos 3 primeiros segundos e adaptação visual com cortes dinâmicos.">
      <a-cylinder position="0 0.75 0" radius="0.3" height="1.5" color="#E91E63"></a-cylinder>
      <a-sphere position="0 1.7 0" radius="0.25" color="#FFCCBC"></a-sphere>
      <!-- Smartphone na mão -->
      <a-box position="0.35 1 0.3" width="0.1" height="0.2" depth="0.02" color="#212121"></a-box>
      <a-ring rotation="-90 0 0" radius-inner="0.4" radius-outer="0.5" color="#E91E63"></a-ring>
    </a-entity>

    <!-- ================= Totem 1: Podcasting & Áudio ================= -->
    <a-entity id="totem-audio" position="0 0 -7"
              proximity-trigger="title: Estação de Áudio; message: O áudio conecta em multitarefa. Podcasting e pílulas de áudio criam profundidade e vínculo íntimo com a audiência.">
      <!-- Pedestal -->
      <a-box position="0 0.5 0" width="0.8" height="1" depth="0.8" color="#37474F"></a-box>
      <!-- Ícone 3D de Microfone -->
      <a-cylinder position="0 1.3 0" radius="0.12" height="0.4" color="#ECEFF1" metalness="0.7"></a-cylinder>
      <a-sphere position="0 1.5 0" radius="0.12" color="#90A4AE"></a-sphere>
      <a-ring rotation="-90 0 0" radius-inner="0.6" radius-outer="0.7" color="#FFB300"></a-ring>
    </a-entity>

    <!-- ================= Totem 2: Repurposing & Estratégia ================= -->
    <a-entity id="totem-repurpose" position="-3 0 3"
              proximity-trigger="title: Hub de Adaptação; message: Não basta dar Ctrl C e Ctrl V. Reempacotar significa traduzir a mensagem respeitando o tom e linguagem de cada plataforma.">
      <a-cylinder position="0 0.6 0" radius="0.4" height="1.2" color="#455A64"></a-cylinder>
      <!-- Prisma Flutuante Giratório -->
      <a-octahedron position="0 1.6 0" radius="0.35" color="#00E676"
                     animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-octahedron>
      <a-ring rotation="-90 0 0" radius-inner="0.6" radius-outer="0.7" color="#00E676"></a-ring>
    </a-entity>

  </a-scene>
</body>
</html>
